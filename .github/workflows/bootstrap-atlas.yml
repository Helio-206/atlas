name: Validate Atlas

on:
  push:
    branches:
      - agent/bootstrap-atlas
      - agent/supabase-clients
      - agent/database-foundation
      - agent/multiempresa-rls
      - agent/authentication
      - agent/company-onboarding

permissions:
  contents: read

concurrency:
  group: atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inspect Supabase CLI commands
        run: |
          pnpm exec supabase --version
          pnpm exec supabase migration list --help
          pnpm exec supabase db reset --help
          pnpm exec supabase db lint --help
          pnpm exec supabase db advisors --help
          pnpm exec supabase status --help

      - name: Verify Atlas onboarding structure
        run: |
          test -f src/proxy.ts
          test -f src/lib/supabase/proxy.ts
          test -f src/app/login/page.tsx
          test -f src/app/signup/page.tsx
          test -f src/app/forgot-password/page.tsx
          test -f src/app/auth/callback/route.ts
          test -f src/app/dashboard/page.tsx
          test -f src/app/onboarding/company/page.tsx
          test -f src/modules/identity/auth/actions.ts
          test -f src/modules/identity/company-onboarding/actions.ts
          test -f src/modules/identity/company-onboarding/queries.ts
          test -f src/modules/identity/company-onboarding/schemas.ts
          test -f supabase/migrations/20260807101645_company_onboarding.sql
          test -f supabase/tests/company_onboarding.sql
          test -f tests/auth-flow.mjs
          grep -Fq 'schemas = ["public", "graphql_public", "identity"]' supabase/config.toml
          grep -q 'http://127.0.0.1:3000/\*\*' supabase/config.toml
          git check-ignore -q .env.local
          ! git check-ignore -q .env.example

      - name: Verify normal flows avoid privileged client
        run: |
          ! grep -R 'createAdminSupabaseClient' \
            src/app/login src/app/signup src/app/forgot-password \
            src/app/auth src/app/onboarding src/modules/identity/auth \
            src/modules/identity/company-onboarding tests/auth-flow.mjs
          ! grep -R 'SUPABASE_SERVICE_ROLE_KEY' \
            src/app/login src/app/signup src/app/forgot-password \
            src/app/auth src/app/onboarding src/modules/identity/auth \
            src/modules/identity/company-onboarding tests/auth-flow.mjs

      - name: Run lint
        run: pnpm lint

      - name: Run Vitest
        run: pnpm test

      - name: Start Supabase local stack
        run: pnpm exec supabase start

      - name: Reset database from migrations
        run: pnpm exec supabase db reset

      - name: Verify local migration history
        run: pnpm exec supabase migration list --local

      - name: Verify database contracts
        run: |
          DB_CONTAINER=$(docker ps \
            --filter "label=com.supabase.cli.project=atlas" \
            --filter "name=supabase_db_" \
            --format '{{.Names}}' | head -n 1)

          test -n "$DB_CONTAINER"

          for test_file in \
            supabase/tests/atlas_foundation.sql \
            supabase/tests/rls_isolation.sql \
            supabase/tests/auth_profile.sql \
            supabase/tests/company_onboarding.sql
          do
            docker exec -i "$DB_CONTAINER" \
              psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
              < "$test_file"
          done

      - name: Export local Supabase application variables
        run: |
          eval "$(pnpm exec supabase status -o env)"
          test -n "$API_URL"

          if [ -n "${PUBLISHABLE_KEY:-}" ]; then
            PUBLIC_KEY="$PUBLISHABLE_KEY"
          else
            PUBLIC_KEY="$ANON_KEY"
          fi

          test -n "$PUBLIC_KEY"
          echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLIC_KEY" >> "$GITHUB_ENV"

      - name: Build application and verify browser bundle
        run: pnpm build

      - name: Install Chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
        run: pnpm exec playwright install --with-deps chromium

      - name: Start Atlas application
        run: |
          nohup pnpm start > /tmp/atlas-app.log 2>&1 &
          echo $! > /tmp/atlas-app.pid

          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/atlas-app.log
          exit 1

      - name: Verify authentication and onboarding in browser
        run: pnpm test:auth:integration

      - name: Lint database schemas
        run: |
          pnpm exec supabase db lint \
            --local \
            --schema identity,projects,audit,platform \
            --fail-on error

      - name: Run database advisors
        run: pnpm exec supabase db advisors --local

      - name: Check Supabase local status
        run: pnpm exec supabase status

      - name: Stop Atlas application
        if: always()
        run: |
          if [ -f /tmp/atlas-app.pid ]; then
            kill "$(cat /tmp/atlas-app.pid)" || true
          fi

      - name: Stop Supabase local stack
        if: always()
        run: pnpm exec supabase stop || true
