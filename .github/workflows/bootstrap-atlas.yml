name: Validate Atlas

on:
  push:
    branches:
      - agent/bootstrap-atlas
      - agent/supabase-clients
      - agent/database-foundation
      - agent/multiempresa-rls
      - agent/authentication
      - agent/company-onboarding
      - agent/projects-module
      - sprint2-procurement-core
      - sprint3-suppliers-quotations
      - sprint3-suppliers-quotations-final
      - sprint4-purchase-orders-receipts
      - sprint5-ux-application-shell
      - sprint6-pilot-readiness

permissions:
  contents: read

concurrency:
  group: atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Initial Git status
        run: git status --short --branch

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inspect Supabase CLI commands
        run: |
          pnpm exec supabase --version
          pnpm exec supabase migration new --help
          pnpm exec supabase migration list --help
          pnpm exec supabase db reset --help
          pnpm exec supabase db lint --help
          pnpm exec supabase db advisors --help
          pnpm exec supabase status --help

      - name: Verify Sprint 6 structure
        run: |
          test -f supabase/migrations/20260809160421_pilot_readiness.sql
          test -f supabase/migrations/20260809164045_pilot_seed_hardening.sql
          test -f supabase/seed.sql
          test -f supabase/tests/pilot_readiness_integration.sql
          test -f supabase/tests/pilot_readiness_rls.sql
          test -f supabase/tests/pilot_security.sql
          test -f src/modules/documents/domain/documents.ts
          test -f src/modules/documents/domain/documents.test.ts
          test -f src/modules/documents/infrastructure/documents-repository.ts
          test -f src/modules/documents/application/documents-use-cases.ts
          test -f src/modules/documents/presentation/actions.ts
          test -f src/modules/documents/presentation/document-section.tsx
          test -f src/modules/notifications/infrastructure/notifications-repository.ts
          test -f src/modules/notifications/application/notification-use-cases.ts
          test -f src/modules/identity/admin/infrastructure/admin-repository.ts
          test -f src/app/dashboard/users/page.tsx
          test -f src/app/dashboard/audit/page.tsx
          test -f scripts/demo-reset.mjs
          test -f scripts/demo-reset-guard.mjs
          test -f scripts/demo-reset-guard.test.mjs
          test -f tests/demo-procurement-journey.mjs
          test -f tests/performance-smoke.mjs
          test -f docs/demo/procurement-demo.md
          test -f docs/pilot/pilot-checklist.md
          test -f docs/operations/backup-restore.md
          test -f docs/operations/demo-environment.md
          test -f docs/security/pilot-security-review.md

      - name: Verify security and scope boundaries
        run: |
          ! grep -R 'SUPABASE_SERVICE_ROLE_KEY\|createAdminSupabaseClient\|service_role' \
            src/app src/components src/modules src/platform \
            --exclude='*.test.ts' --exclude='*.test.tsx'
          ! grep -R 'name="company_id"\|companyId:' \
            src/modules/procurement/presentation src/modules/documents/presentation src/app/dashboard/purchase-orders
          if grep -R -E 'Inventory|Accounting|ERP Integration|Workflow Builder|Artificial Intelligence|MCP|Mobile app' \
            src/modules src/app/dashboard; then
            echo 'Out-of-scope Sprint 6 functionality detected.' >&2
            exit 1
          fi

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - name: Start Supabase local stack
        run: pnpm exec supabase start

      - name: Reset database from migrations
        run: pnpm exec supabase db reset

      - name: Verify local migration history
        run: pnpm exec supabase migration list --local

      - name: Run integration contracts
        run: pnpm test:integration

      - name: Run RLS and security contracts
        run: pnpm test:rls

      - name: Export local Supabase application and demo variables
        run: |
          eval "$(pnpm exec supabase status -o env)"
          test -n "$API_URL"
          test -n "$SECRET_KEY"
          if [ -n "${PUBLISHABLE_KEY:-}" ]; then PUBLIC_KEY="$PUBLISHABLE_KEY"; else PUBLIC_KEY="$ANON_KEY"; fi
          test -n "$PUBLIC_KEY"
          DEMO_PASSWORD="Atlas-CI-$(openssl rand -hex 12)!"
          echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLIC_KEY" >> "$GITHUB_ENV"
          echo "ATLAS_TEST_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "ATLAS_TEST_PUBLISHABLE_KEY=$PUBLIC_KEY" >> "$GITHUB_ENV"
          echo "ATLAS_ENV=local" >> "$GITHUB_ENV"
          echo "ATLAS_DEMO_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "ATLAS_DEMO_SECRET_KEY=$SECRET_KEY" >> "$GITHUB_ENV"
          echo "ATLAS_DEMO_PASSWORD=$DEMO_PASSWORD" >> "$GITHUB_ENV"

      - name: Rebuild reproducible demo data
        run: pnpm demo:reset

      - name: Build application and verify browser bundle
        run: pnpm build

      - name: Install Chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
        run: pnpm exec playwright install --with-deps chromium

      - name: Start Atlas application
        run: |
          nohup pnpm start > /tmp/atlas-app.log 2>&1 &
          echo $! > /tmp/atlas-app.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/atlas-app.log
          exit 1

      - name: Run complete E2E suite
        run: pnpm test:e2e

      - name: Run pilot performance smoke test
        run: pnpm test:performance:smoke

      - name: Show Atlas application log on browser failure
        if: failure()
        run: cat /tmp/atlas-app.log || true

      - name: Lint database schemas
        run: pnpm exec supabase db lint --local --schema identity,projects,procurement,documents,notifications,audit,platform --fail-on error

      - name: Run database advisors
        run: pnpm exec supabase db advisors --local

      - name: Check Supabase local status
        run: pnpm exec supabase status

      - name: Verify Git diff formatting
        run: git diff --check

      - name: Show Git status
        run: git status --short --branch

      - name: Stop Atlas application
        if: always()
        run: |
          if [ -f /tmp/atlas-app.pid ]; then kill "$(cat /tmp/atlas-app.pid)" || true; fi

      - name: Stop Supabase local stack
        if: always()
        run: pnpm exec supabase stop || true
