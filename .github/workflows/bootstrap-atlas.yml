name: Validate Atlas

on:
  push:
    branches:
      - agent/bootstrap-atlas
      - agent/supabase-clients
      - agent/database-foundation
      - agent/multiempresa-rls
      - agent/authentication
      - agent/company-onboarding
      - agent/projects-module
      - sprint2-procurement-core
      - sprint3-suppliers-quotations

permissions:
  contents: read

concurrency:
  group: atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Initial Git status
        run: git status --short --branch

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inspect Supabase CLI commands
        run: |
          pnpm exec supabase --version
          pnpm exec supabase migration new --help
          pnpm exec supabase migration list --help
          pnpm exec supabase db reset --help
          pnpm exec supabase db lint --help
          pnpm exec supabase db advisors --help
          pnpm exec supabase status --help

      - name: Generate Sprint 3 structure migration shell
        run: |
          before="$(find supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort)"
          pnpm exec supabase migration new supplier_quotation_structures
          after="$(find supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort)"
          echo "$after"
          comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after")

      - name: Verify Sprint 2 structure
        run: |
          test -f supabase/migrations/20260808162730_procurement_core.sql
          test -f supabase/migrations/20260808190000_procurement_security_hardening.sql
          test -f supabase/migrations/20260808185146_suppliers_quotations_selection.sql
          test -f supabase/tests/procurement_integration_v2.sql
          test -f supabase/tests/procurement_rls.sql
          test -f supabase/tests/procurement_security.sql
          test -f src/modules/procurement/domain/purchase-request.ts
          test -f src/modules/procurement/domain/purchase-request.test.ts
          test -f src/modules/procurement/domain/permissions.ts
          test -f src/modules/procurement/application/use-cases.ts
          test -f src/modules/procurement/infrastructure/procurement-repository.ts
          test -f src/modules/procurement/presentation/access.ts
          test -f src/modules/procurement/presentation/actions.ts
          test -f src/modules/procurement/presentation/purchase-request-form.tsx
          test -f src/modules/procurement/presentation/components.tsx
          test -f src/modules/procurement/presentation/feedback.ts
          test -f src/modules/procurement/contracts/schemas.ts
          test -f src/app/dashboard/procurement/page.tsx
          test -f src/app/dashboard/procurement/new/page.tsx
          test -f 'src/app/dashboard/procurement/[id]/page.tsx'
          test -f src/app/dashboard/approvals/page.tsx
          test -f tests/setup-procurement-e2e.mjs
          test -f tests/procurement-flow.mjs
          test -f scripts/test-sql-contracts.mjs

      - name: Verify security boundaries
        run: |
          ! grep -R 'SUPABASE_SERVICE_ROLE_KEY\|createAdminSupabaseClient' \
            src/modules/procurement src/app/dashboard/procurement src/app/dashboard/approvals \
            tests/setup-procurement-e2e.mjs tests/procurement-flow.mjs
          ! grep -R 'company_id' \
            src/modules/procurement/presentation/actions.ts \
            src/modules/procurement/presentation/purchase-request-form.tsx
          if grep -R -E 'Quotation|Supplier|Purchase Order|Goods Receipt|Workflow Builder' \
            src/modules/procurement src/app/dashboard/procurement src/app/dashboard/approvals; then
            echo 'Out-of-scope Procurement functionality detected.' >&2
            exit 1
          fi

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - name: Start Supabase local stack
        run: pnpm exec supabase start

      - name: Reset database from migrations
        run: pnpm exec supabase db reset

      - name: Verify local migration history
        run: pnpm exec supabase migration list --local

      - name: Run integration contracts
        run: pnpm test:integration

      - name: Run RLS contracts
        run: pnpm test:rls

      - name: Export local Supabase application variables
        run: |
          eval "$(pnpm exec supabase status -o env)"
          test -n "$API_URL"

          if [ -n "${PUBLISHABLE_KEY:-}" ]; then
            PUBLIC_KEY="$PUBLISHABLE_KEY"
          else
            PUBLIC_KEY="$ANON_KEY"
          fi

          test -n "$PUBLIC_KEY"
          echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLIC_KEY" >> "$GITHUB_ENV"
          echo "ATLAS_TEST_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "ATLAS_TEST_PUBLISHABLE_KEY=$PUBLIC_KEY" >> "$GITHUB_ENV"

      - name: Build application and verify browser bundle
        run: pnpm build

      - name: Install Chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
        run: pnpm exec playwright install --with-deps chromium

      - name: Start Atlas application
        run: |
          nohup pnpm start > /tmp/atlas-app.log 2>&1 &
          echo $! > /tmp/atlas-app.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/atlas-app.log
          exit 1

      - name: Run complete E2E suite
        run: pnpm test:e2e

      - name: Show Atlas application log on browser failure
        if: failure()
        run: cat /tmp/atlas-app.log || true

      - name: Lint database schemas
        run: |
          pnpm exec supabase db lint --local --schema identity,projects,procurement,audit,platform --fail-on error

      - name: Run database advisors
        run: pnpm exec supabase db advisors --local

      - name: Check Supabase local status
        run: pnpm exec supabase status

      - name: Verify Git diff formatting
        run: git diff --check

      - name: Show Git status
        run: git status --short --branch

      - name: Stop Atlas application
        if: always()
        run: |
          if [ -f /tmp/atlas-app.pid ]; then kill "$(cat /tmp/atlas-app.pid)" || true; fi

      - name: Stop Supabase local stack
        if: always()
        run: pnpm exec supabase stop || true
