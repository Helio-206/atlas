name: Validate Atlas

on:
  push:
    branches:
      - agent/bootstrap-atlas
      - agent/supabase-clients
      - agent/database-foundation
      - agent/multiempresa-rls

permissions:
  contents: write

concurrency:
  group: atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inspect migration command
        run: |
          pnpm exec supabase --version
          pnpm exec supabase migration new --help

      - name: Create versioned multiempresa RLS migration shell
        run: |
          if ! find supabase/migrations -maxdepth 1 -type f -name '*_multiempresa_rls.sql' -print -quit | grep -q .; then
            pnpm exec supabase migration new multiempresa_rls
          fi
          find supabase/migrations -maxdepth 1 -type f -name '*_multiempresa_rls.sql' -print

      - name: Commit generated migration shell
        run: |
          git config user.name "atlas-validation-bot"
          git config user.email "atlas-validation-bot@users.noreply.github.com"
          git add supabase/migrations

          if git diff --cached --quiet; then
            echo "Migration shell already exists."
            exit 0
          fi

          git commit -m "create multiempresa RLS migration"
          git push origin HEAD:${GITHUB_REF_NAME}
