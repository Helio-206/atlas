name: Validate Atlas

on:
  push:
    branches:
      - agent/bootstrap-atlas
      - agent/supabase-clients

permissions:
  contents: write

concurrency:
  group: atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Inspect Supabase CLI commands
        run: |
          pnpm exec supabase --version
          pnpm exec supabase --help
          pnpm exec supabase init --help
          pnpm exec supabase start --help
          pnpm exec supabase status --help

      - name: Initialize Supabase locally
        run: |
          if [ ! -f supabase/config.toml ]; then
            pnpm exec supabase init
          fi

      - name: Verify Atlas structure
        run: |
          test -d src/app
          test -d src/modules/identity
          test -d src/modules/projects
          test -d src/modules/procurement
          test -d src/modules/documents
          test -d src/modules/notifications
          test -d src/modules/audit
          test -d src/platform/auth
          test -d src/platform/database
          test -d src/platform/events
          test -d src/platform/storage
          test -d src/platform/observability
          test -d src/shared/domain
          test -d src/shared/application
          test -d src/shared/ui
          test -f src/lib/supabase/browser.ts
          test -f src/lib/supabase/server.ts
          test -f src/lib/supabase/admin.ts
          test -f .env.example
          test -f supabase/config.toml
          git check-ignore -q .env.local
          ! git check-ignore -q .env.example

      - name: Verify restricted dependencies are absent
        run: |
          node <<'NODE'
          const packageJson = require('./package.json')
          const dependencies = {
            ...packageJson.dependencies,
            ...packageJson.devDependencies
          }
          const forbidden = [
            'prisma',
            '@prisma/client',
            'drizzle-orm',
            'redux',
            '@reduxjs/toolkit',
            '@nestjs/core'
          ]
          const found = forbidden.filter((dependency) => dependency in dependencies)

          if (found.length > 0) {
            throw new Error(`Forbidden dependencies detected: ${found.join(', ')}`)
          }
          NODE

      - name: Run lint
        run: pnpm lint

      - name: Run Vitest
        run: pnpm test

      - name: Build application and verify browser bundle
        run: pnpm build

      - name: Start Supabase local stack
        run: pnpm exec supabase start

      - name: Check Supabase local status
        run: pnpm exec supabase status

      - name: Stop Supabase local stack
        if: always()
        run: pnpm exec supabase stop || true

      - name: Commit generated dependency and Supabase files
        if: success()
        run: |
          git config user.name "atlas-validation-bot"
          git config user.email "atlas-validation-bot@users.noreply.github.com"
          git add pnpm-lock.yaml supabase

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "refresh Atlas generated files"
          git push origin HEAD:${GITHUB_REF_NAME}
