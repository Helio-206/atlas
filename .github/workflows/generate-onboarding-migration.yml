name: Generate onboarding migration

on:
  push:
    branches:
      - agent/company-onboarding

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate migration with Supabase CLI
        run: |
          if compgen -G 'supabase/migrations/*_company_onboarding.sql' > /dev/null; then
            echo 'Migration already exists.'
            exit 0
          fi

          pnpm exec supabase migration new company_onboarding
          git config user.name 'atlas-validation-bot'
          git config user.email 'atlas-validation-bot@users.noreply.github.com'
          git add supabase/migrations
          git commit -m 'generate company onboarding migration'
          git push origin HEAD:${GITHUB_REF_NAME}
