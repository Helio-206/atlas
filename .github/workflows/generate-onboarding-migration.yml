name: Repair onboarding config

on:
  push:
    branches:
      - agent/company-onboarding

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Restore base config and expose identity only
        run: |
          git show origin/agent/authentication:supabase/config.toml > supabase/config.toml
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/config.toml')
          text = path.read_text()
          old = 'schemas = ["public", "graphql_public"]'
          new = 'schemas = ["public", "graphql_public", "identity"]'

          if old not in text:
              raise SystemExit('Expected API schema configuration not found')

          path.write_text(text.replace(old, new, 1))
          PY

          git config user.name 'atlas-validation-bot'
          git config user.email 'atlas-validation-bot@users.noreply.github.com'
          git add supabase/config.toml

          if git diff --cached --quiet; then
            echo 'Supabase config already correct.'
            exit 0
          fi

          git commit -m 'expose identity schema for onboarding RPC'
          git push origin HEAD:${GITHUB_REF_NAME}
